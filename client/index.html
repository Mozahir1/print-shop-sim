<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Print Shop Sim</title>
    <style>
      :root {
        --bg: #f3f1ec;
        --card: #ffffff;
        --ink: #1f2328;
        --muted: #6b7078;
        --line: #dedad2;
        --accent: #2f5d8a;
        --accent-ink: #ffffff;
        --soft: #e7eef6;
        --ok: #2e7d4f;
        --warn: #a86400;
        --bad: #b3261e;
        --bad-bg: #fbe5e3;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17191c;
          --card: #22252a;
          --ink: #e6e6e3;
          --muted: #9a9ea6;
          --line: #363a40;
          --accent: #7aa7d6;
          --accent-ink: #10141a;
          --soft: #263241;
          --ok: #6cc28f;
          --warn: #e0a54a;
          --bad: #f08a80;
          --bad-bg: #3d2423;
        }
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
      button { font: inherit; color: inherit; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
      .muted { color: var(--muted); }
      .small { font-size: 13px; }
      .ok { color: var(--ok); }
      .warn { color: var(--warn); }
      kbd { font: 11px ui-monospace, monospace; border: 1px solid currentColor; border-radius: 3px; padding: 0 3px; opacity: .7; }

      #wrap { display: flex; gap: 12px; padding: 8px; align-items: flex-start; }
      #game { flex: 1; min-width: 0; display: flex; justify-content: center; position: relative; }
      #layer { position: absolute; width: 640px; height: 360px; transform-origin: left top; pointer-events: none; }
      #layer > * { position: absolute; pointer-events: auto; }
      #game canvas { image-rendering: pixelated; touch-action: none; }
      #side { width: 260px; flex: none; display: flex; flex-direction: column; gap: 10px; }
      @media (max-width: 900px) { #wrap { flex-direction: column; align-items: stretch; } #side { width: 100%; } }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }

      .btn { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 7px 10px; cursor: pointer; text-align: left; min-height: 38px; }
      .btn:hover { border-color: var(--accent); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      .btn.corner { border-style: dashed; }
      .btn.off { opacity: .45; }
      .btn .dur { opacity: .7; font-size: .8em; margin-left: 6px; }
      .btn .kind { display: block; font-size: .7em; text-transform: uppercase; letter-spacing: .05em; opacity: .75; }
      .btns { display: flex; flex-wrap: wrap; gap: 6px; }
      .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
      .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }

      /* In-world overlays inside the game (sized in game pixels; they scale with the game). */
      .overlay-ui { font: 8px/1.3 system-ui, sans-serif; color: #1f2328; }
      .overlay-ui .btn { min-height: 0; padding: 2px 5px; border-radius: 3px; font-size: 8px; background: #fff; border-color: #c9c4b8; color: #1f2328; }
      .overlay-ui .btn.primary { background: #2f5d8a; border-color: #2f5d8a; color: #fff; }
      .overlay-ui h2 { font-size: 7px; margin: 0 0 3px; color: #6b7078; }
      .overlay-ui .small { font-size: 7px; }
      .overlay-ui .muted { color: #6b7078; }
      .overlay-ui .btns, .overlay-ui .choices { gap: 3px; }
      .dialog { width: 330px; max-height: 290px; overflow-y: auto; }
      .textbox { border: 2px solid #1f2328; border-radius: 4px; padding: 4px 7px; margin-bottom: 4px; background: #fffdf6; cursor: pointer; position: relative; }
      .textbox .who { font-size: 7px; font-weight: 700; color: #6b7078; }
      .textbox p { margin: 1px 0; }
      .textbox .more { position: absolute; right: 5px; bottom: 3px; font-size: 7px; color: #6b7078; }
      .dialog > .small, .dialog > p { background: #fffdf6e8; padding: 2px 4px; margin: 0 0 3px; border-radius: 3px; }
      .monitor { width: 408px; height: 228px; overflow-y: auto; background: #eef3f7; padding: 6px 8px; border-radius: 2px; }
      .monitor .msg { padding: 2px 0; border-bottom: 1px solid #d4dce3; }
      .monitor .msg.unread .subj { font-weight: 700; }
      .labelform { width: 230px; background: #f6f6f2; border: 2px solid #4a525e; border-radius: 3px; padding: 5px 7px; }
      .orderform { display: flex; flex-direction: column; gap: 4px; }
      .field { display: flex; align-items: center; gap: 6px; border: 0; padding: 0; margin: 0; flex-wrap: wrap; }
      .field > span { min-width: 46px; color: #6b7078; }
      .field input[type=number] { width: 60px; font: inherit; padding: 2px 4px; border: 1px solid #b8b3a7; border-radius: 3px; background: #fff; color: #1f2328; }
      .chips { display: flex; flex-wrap: wrap; gap: 3px; }
      .chip-opt input { position: absolute; opacity: 0; }
      .chip-opt span { display: inline-block; border: 1px solid #b8b3a7; border-radius: 8px; padding: 2px 6px; cursor: pointer; background: #fff; }
      .chip-opt input:checked + span { background: #2f5d8a; color: #fff; border-color: #2f5d8a; }
      .chip-opt input:focus-visible + span { outline: 1px solid #2f5d8a; }

      #notes { display: flex; flex-direction: column; gap: 8px; }
      .note { background: #fff3a8; color: #2b2a1f; padding: 8px 10px; border-radius: 2px; box-shadow: 1px 2px 4px rgba(0,0,0,.15); font: 14px/1.35 "Comic Sans MS", "Marker Felt", system-ui, sans-serif; transition: opacity .5s; }
      .note .hint { margin-top: 4px; font-size: 12px; font-weight: 700; color: #6b5a00; }
      .note.done > div:first-child { text-decoration: line-through; }
      #log ol { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto; font-size: 13px; }
      #log li { padding: 1px 0; display: flex; gap: 10px; }
      #log time { color: var(--muted); min-width: 64px; font-variant-numeric: tabular-nums; }

      .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
      .overlay > div { background: var(--card); border-radius: 10px; padding: 22px; width: 560px; max-width: 100%; max-height: 90vh; overflow-y: auto; }
      .overlay h1 { margin: 0 0 8px; font-size: 20px; }
      dl.report { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; margin: 12px 0; }
      dl.report dt { color: var(--muted); }
      dl.report dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
      ul.failures { margin: 0; padding-left: 18px; font-size: 14px; }
      ul.plain { list-style: none; margin: 0; padding: 0; }
      .tone { padding: 10px 12px; border-radius: 8px; background: var(--soft); margin: 12px 0; }
      input[type=text] { max-width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); }

      #dev { position: fixed; right: 0; top: 0; bottom: 0; width: 360px; max-width: 100%; background: var(--card); border-left: 1px solid var(--line); z-index: 8; overflow-y: auto; padding: 14px; font-size: 13px; }
      #dev section { margin-bottom: 14px; }
      #dev pre { white-space: pre-wrap; font-size: 12px; margin: 0; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="game"><div id="layer"></div></div>
      <div id="side">
        <div class="card"><h2>Notes</h2><div id="notes"></div></div>
        <div class="card" id="log"></div>
      </div>
    </div>
    <aside id="dev" hidden></aside>
    <div id="screen" class="overlay" hidden><div id="screenBody"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
