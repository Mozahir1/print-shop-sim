<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Print Shop Sim</title>
    <style>
      /* The HUD is real DOM laid over the canvas. 1rem is 20px of the 1280x720 layout (hud.ts sets the root font size
         from the canvas's size), so everything here is sized in rem: body text 1rem, labels .8rem, headings 1.4rem,
         buttons at least 2.8rem tall. Regions are placed from view/layout.ts. */
      :root {
        --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --hand: "Comic Sans MS", "Marker Felt", "Chalkboard SE", cursive;
        --bar: #1f2328;
        --bar-2: #2a2f36;
        --bar-line: #454c56;
        --bar-ink: #f2f2ef;
        --bar-muted: #b4b9c1;
        --paper: #ffffff;
        --paper-2: #f3f1ec;
        --ink: #1f2328;
        --muted: #59606a;
        --line: #b9b3a6;
        --accent: #2f5d8a;
        --accent-light: #8fb8e3;
        --ok: #1f6b3e;
        --warn: #8a5200;
        --bad: #b3261e;
        --bad-bg: #fbe5e3;
        --pulse: #e0a54a;
        font-size: 20px;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #101215; }
      body { font: 1rem/1.3 var(--ui); color: var(--ink); }
      button { font: inherit; color: inherit; }
      h1 { margin: 0 0 .5rem; font-size: 1.4rem; }
      h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 .3rem; font-weight: 700; }
      p { margin: .4rem 0; }
      .muted { color: var(--muted); }
      .small { font-size: .8rem; }
      .ok { color: var(--ok); }
      .warn { color: var(--warn); }
      kbd { font: 700 .8rem var(--ui); border: 1px solid currentColor; border-radius: .2rem; padding: 0 .2rem; opacity: .75; }

      #game { position: fixed; inset: 0; }
      #game canvas { image-rendering: pixelated; touch-action: none; }
      #hud { position: fixed; pointer-events: none; }
      .region { position: absolute; overflow: hidden; }

      /* ---------- buttons ---------- */
      .btn { pointer-events: auto; display: inline-flex; flex-direction: column; justify-content: center; border: 2px solid var(--line); background: var(--paper); color: var(--ink); border-radius: .4rem; padding: .3rem .7rem; cursor: pointer; text-align: left; min-height: 2.8rem; min-width: 2.8rem; line-height: 1.2; }
      .btn:hover { border-color: var(--accent); }
      .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .btn.corner { border-style: dashed; }
      .btn.off { opacity: .5; }
      .btn .dur { font-size: .8rem; opacity: .85; }
      .btn .kind { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; opacity: .85; }
      .btns { display: flex; flex-wrap: wrap; gap: .4rem; }
      .row { display: flex; justify-content: space-between; gap: .5rem; align-items: center; flex-wrap: wrap; }
      .choices { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; }

      /* ---------- top bar ---------- */
      #top { background: var(--bar); color: var(--bar-ink); border-bottom: 2px solid var(--bar-line); padding: .3rem .6rem; display: flex; flex-direction: column; }
      #top .row1 { display: flex; align-items: center; gap: .8rem; height: 2.9rem; }
      #clock { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
      #mood { white-space: nowrap; color: var(--bar-muted); }
      #mood b { color: var(--bar-ink); }
      #doing { flex: 1; min-width: 0; color: var(--bar-muted); line-height: 1.2; max-height: 2.4em; overflow: hidden; }
      #doing b { color: var(--bar-ink); }
      #top .btn { background: var(--bar-2); border-color: var(--bar-line); color: var(--bar-ink); white-space: nowrap; }
      #top .btn.on { background: var(--accent-light); border-color: var(--accent-light); color: #10141a; }
      #top .btn.ghost { visibility: hidden; }
      #holding { flex-direction: row; align-items: center; gap: .4rem; padding: .1rem .6rem .1rem .2rem; cursor: default; max-width: 18rem; }
      #holding.carry { cursor: pointer; border-color: var(--pulse); }
      #holding img { width: 2.4rem; height: 2.4rem; image-rendering: pixelated; object-fit: contain; background: #10141a; border-radius: .3rem; }
      #holding > span { display: flex; flex-direction: column; white-space: nowrap; line-height: 1.15; }
      #holding small { font-size: .8rem; color: var(--pulse); }
      #ghost { position: absolute; z-index: 5; pointer-events: none; image-rendering: pixelated; transform: translate(-50%, -50%) rotate(-4deg); filter: drop-shadow(0 .3rem .3rem rgba(0,0,0,.45)); opacity: .92; }
      #top .row2 { display: flex; align-items: center; gap: .8rem; flex: 1; min-height: 0; }
      #next { flex: 1; min-width: 0; font-size: 1.1rem; font-weight: 700; white-space: nowrap; overflow: hidden; }
      #next .where { color: var(--pulse); }
      #banner { background: var(--bad); color: #fff; font-weight: 700; padding: .1rem .6rem; border-radius: .3rem; white-space: nowrap; }

      /* ---------- the stage: modals, messages, tooltips ---------- */
      #stage { overflow: visible; }
      #modal { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 1rem; }
      .modal-box { pointer-events: auto; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: .6rem; box-shadow: 0 .4rem 1.2rem rgba(0,0,0,.35); padding: .9rem 1rem; max-width: 100%; max-height: 100%; overflow-y: auto; }
      .modal-box.screen { width: 34rem; }
      .modal-box.dialog { width: 36rem; padding: .7rem .9rem; }
      .modal-box.dialog p { margin: .2rem 0; }
      .answers { grid-template-columns: repeat(3, 1fr); }
      .answers .btn { padding: .25rem .5rem; }
      .modal-box.monitor { width: 42rem; height: 24.6rem; background: #eef3f7; border-color: #10141a; border-width: .4rem; display: grid; grid-template-columns: 7.4rem 1fr; gap: .7rem; padding: .6rem; overflow: hidden; }
      .modal-box.labelform { width: 26rem; background: #f6f6f2; }
      .modal-box.keypad { width: 18rem; background: #2f3a48; color: #fff; border-color: #10141a; }
      #toast, #flash { position: absolute; left: 50%; transform: translateX(-50%); max-width: 90%; padding: .3rem .8rem; border-radius: .4rem; font-weight: 600; opacity: 0; transition: opacity .3s; text-align: center; z-index: 3; }
      #toast { top: .6rem; background: rgba(16, 20, 26, .92); color: #fff; }
      #flash { top: 3.4rem; background: var(--bad-bg); color: var(--bad); border: 2px solid var(--bad); }
      #toast.show, #flash.show { opacity: 1; transition: none; }
      #tooltip { position: absolute; z-index: 4; background: rgba(16, 20, 26, .94); color: #fff; font-size: .8rem; font-weight: 600; padding: .2rem .5rem; border-radius: .3rem; white-space: nowrap; transform: translate(-50%, -100%); }

      /* ---------- the counter: what they say, and your answers ---------- */
      .textbox { border: 3px solid var(--ink); border-radius: .4rem; padding: .4rem .7rem 1.2rem; margin-bottom: .5rem; background: #fffdf6; cursor: pointer; position: relative; }
      .textbox .who { font-size: .8rem; font-weight: 700; color: var(--muted); }
      .textbox p { margin: .1rem 0; break-inside: avoid; }
      .textbox.cols { column-count: 2; column-gap: 1.2rem; }
      .textbox.cols .who { column-span: all; }
      .textbox .more { position: absolute; right: .5rem; bottom: .2rem; font-size: .8rem; color: var(--muted); }

      /* ---------- the register keypad ---------- */
      .keypad .display { background: #10141a; color: #7cff9a; border-radius: .3rem; padding: .4rem .6rem; margin-bottom: .6rem; font-variant-numeric: tabular-nums; }
      .keypad .display .typed { font-size: 1.4rem; font-weight: 700; }
      .keypad .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: .4rem; }
      .keypad .btn { justify-content: center; align-items: center; font-size: 1.2rem; font-weight: 700; }
      .keypad .btn.okkey { grid-column: 1 / -1; background: var(--ok); border-color: var(--ok); color: #fff; }

      /* ---------- the computer: four apps ---------- */
      .monitor .apps { display: flex; flex-direction: column; gap: .4rem; }
      .monitor .app { pointer-events: auto; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1rem; min-height: 3.6rem; border: 2px solid #c4ccd4; border-radius: .4rem; background: #fff; color: var(--ink); cursor: pointer; font: 600 .8rem var(--ui); }
      .monitor .app svg { width: 1.5rem; height: 1.5rem; }
      .monitor .app.on { background: var(--accent); border-color: var(--accent); color: #fff; }
      .monitor .app .badge { position: absolute; top: .2rem; right: .3rem; min-width: 1.3rem; height: 1.3rem; padding: 0 .3rem; border-radius: .65rem; background: var(--bad); color: #fff; font-size: .8rem; line-height: 1.3rem; text-align: center; }
      .monitor .app-body { overflow-y: auto; min-width: 0; padding-right: .3rem; }
      .monitor h1 { font-size: 1.4rem; margin: 0 0 .4rem; }
      .monitor .list { display: flex; flex-direction: column; gap: .3rem; }
      .stepbar { background: #fff3cd; border: 2px solid var(--pulse); border-radius: .4rem; padding: .4rem .6rem; margin-bottom: .6rem; }
      .stepbar h2 { margin: 0 0 .2rem; color: var(--warn); }
      .order, .device, .pkg { display: flex; align-items: center; gap: .6rem; background: #fff; border: 1px solid #c4ccd4; border-radius: .4rem; padding: .3rem .5rem; min-height: 2.8rem; }
      .order .what { pointer-events: auto; flex: 1; min-width: 0; display: flex; flex-direction: column; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; min-height: 2.8rem; justify-content: center; }
      .order .what span, .device span, .pkg span { font-size: .8rem; color: var(--muted); }
      .order .status, .pkg .status { font-size: .8rem; font-weight: 700; white-space: nowrap; padding: .1rem .4rem; border-radius: .3rem; background: #e7eef6; color: var(--ink); }
      .order.st-printed .status, .order.st-new .status, .order.st-entered .status { background: #fff3cd; }
      .order.st-picked_up { opacity: .6; }
      .device { flex-direction: column; align-items: flex-start; gap: .1rem; }
      .device.down { border-color: var(--bad); background: var(--bad-bg); }
      .device.down > span { color: var(--bad); font-weight: 600; }
      .device.wait { border-color: #c9a227; background: #fdf6dc; }
      .device.wait > span { color: #6b5410; font-weight: 600; }
      .device .btn { align-self: flex-end; }
      .pkg { flex-wrap: wrap; }
      .pkg span { flex: 1; }
      .truck { font-weight: 600; }
      .truck.now { color: var(--bad); }
      .mail { pointer-events: auto; display: grid; grid-template-columns: auto 8rem 1fr auto; align-items: center; gap: .5rem; text-align: left; background: #fff; border: 1px solid #c4ccd4; border-radius: .4rem; padding: .3rem .5rem; min-height: 2.8rem; cursor: pointer; font: inherit; color: var(--ink); }
      .mail b { font-weight: 500; overflow-wrap: anywhere; }
      .mail.unread b, .mail.unread span { font-weight: 800; }
      .mail time { font-size: .8rem; color: var(--muted); }
      .mail .flag { grid-column: 1; font-size: .8rem; font-weight: 800; color: #fff; background: var(--bad); padding: 0 .35rem; border-radius: .3rem; }
      .mail:not(:has(.flag)) b { grid-column: 1 / span 2; }
      .mail-open .body { background: #fff; border: 1px solid #c4ccd4; border-radius: .4rem; padding: .6rem .8rem; margin: .4rem 0 .6rem; white-space: pre-wrap; }
      blockquote.said { margin: 0 0 .3rem; padding: .2rem .6rem; border-left: .25rem solid var(--accent-light); columns: 2; column-gap: 1rem; font-size: .8rem; }
      blockquote.said p { margin: 0; break-inside: avoid; }

      /* ---------- forms ---------- */
      .orderform .fields { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: .3rem 1.2rem; }
      .orderform .fields .field { flex-direction: column; align-items: flex-start; gap: .1rem; }
      .orderform .fields .field > span { min-width: 0; font-size: .8rem; }
      .orderform .fields .field.wide { grid-column: 1 / -1; }
      .orderform > .btn { align-self: flex-start; }
      .monitor .msg { padding: .3rem 0; border-bottom: 1px solid #c4ccd4; }
      .monitor .msg.unread .subj { font-weight: 700; }
      .orderform { display: flex; flex-direction: column; gap: .5rem; }
      .field { display: flex; align-items: center; gap: .6rem; border: 0; padding: 0; margin: 0; flex-wrap: wrap; }
      .field > span { min-width: 5rem; color: var(--muted); font-weight: 600; }
      .field input[type=number] { width: 6rem; min-height: 2.8rem; font: inherit; padding: .2rem .5rem; border: 2px solid var(--line); border-radius: .3rem; background: #fff; color: var(--ink); }
      .chips { display: flex; flex-wrap: wrap; gap: .4rem; }
      .chip-opt { pointer-events: auto; position: relative; }
      .chip-opt input { position: absolute; opacity: 0; }
      .chip-opt span { display: inline-flex; align-items: center; min-height: 2.8rem; border: 2px solid var(--line); border-radius: 1.4rem; padding: 0 .9rem; cursor: pointer; background: #fff; }
      .chip-opt input:checked + span { background: var(--accent); color: #fff; border-color: var(--accent); }
      .chip-opt input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

      /* ---------- the right rail: sticky notes ---------- */
      #rail { background: #2b2620; border-left: 2px solid var(--bar-line); padding: .6rem; display: flex; flex-direction: column; gap: .5rem; }
      #rail > h2 { color: #e8dcc0; font-size: 1.4rem; text-transform: none; letter-spacing: 0; margin: 0; }
      #notes { display: flex; flex-direction: column; gap: .5rem; flex: 1; min-height: 0; }
      .note { pointer-events: auto; display: block; width: 100%; text-align: left; border: 0; cursor: pointer; transition: transform .12s; background: #fff3a8; color: #2b2a1f; padding: .4rem .6rem; border-radius: .1rem; box-shadow: .1rem .2rem .3rem rgba(0,0,0,.3); font: 1rem/1.25 var(--hand); }
      .note .hint { margin-top: .2rem; font-size: .8rem; font-weight: 700; color: #5c4d00; }
      .note.done > div:first-child { text-decoration: line-through; }
      .note:hover, .note:focus-visible { transform: translateY(-.1rem) rotate(-.6deg); outline: none; box-shadow: .2rem .4rem .5rem rgba(0,0,0,.4); }
      .note.open { outline: .2rem solid var(--pulse); }

      /* ---------- a sticky note, unfolded ---------- */
      .modal-box.notecard { width: 46rem; background: #fff3a8; color: #2b2a1f; border: 0; border-radius: .2rem; box-shadow: .3rem .5rem 1.2rem rgba(0,0,0,.45); font-family: var(--hand); }
      .notecard h1 { font-size: 1.4rem; margin-bottom: .1rem; }
      .notecard h2 { color: #5c4d00; margin-top: .4rem; }
      .notecard .cols { display: grid; grid-template-columns: 1fr 1.25fr; gap: 1.2rem; }
      .notecard .muted { color: #5c4d00; }
      .notecard blockquote { margin: .3rem 0; padding: .2rem .7rem; border-left: .25rem solid #c9b44a; columns: 2; column-gap: 1rem; }
      .notecard blockquote p { margin: 0 0 .1rem; break-inside: avoid; }
      dl.spec { display: grid; grid-template-columns: auto 1fr; gap: .1rem 1rem; margin: .3rem 0; }
      dl.spec dt { color: #5c4d00; }
      dl.spec dd { margin: 0; font-weight: 700; }
      ol.steps { list-style: none; margin: 0 0 .6rem; padding: 0; }
      ol.steps li { display: flex; gap: .4rem; align-items: baseline; padding: .05rem 0; line-height: 1.15; }
      ol.steps .mark { width: 1.2rem; flex: none; text-align: center; font-weight: 700; }
      ol.steps .txt { flex: 1; }
      ol.steps .where { font-size: .8rem; color: #5c4d00; font-family: var(--ui); font-weight: 400; white-space: nowrap; }
      ol.steps li.done { color: #6b6440; text-decoration: line-through; }
      ol.steps li.done .where { text-decoration: none; }
      ol.steps li.now { font-weight: 700; background: rgba(224,165,74,.35); border-radius: .2rem; margin: 0 -.3rem; padding: .1rem .3rem; }
      .notecard .btn { font-family: var(--ui); }
      .note.empty { background: transparent; box-shadow: none; color: #d8cdb4; font-family: var(--ui); }
      #more { color: #e8dcc0; font-size: .8rem; font-weight: 700; }
      #recent { border-top: 1px solid #5a5146; padding-top: .3rem; color: #e8dcc0; font-size: .8rem; }
      #recent div { line-height: 1.25; }
      #recent time { color: #bfb39a; margin-right: .4rem; font-variant-numeric: tabular-nums; }

      /* ---------- bottom bar: station tabs, speed ---------- */
      #bottom { background: var(--bar); border-top: 2px solid var(--bar-line); padding: .4rem .6rem; display: flex; gap: .4rem; align-items: stretch; }
      #tabs { display: flex; gap: .4rem; flex: 1; }
      .tab { pointer-events: auto; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1rem; border: 2px solid var(--bar-line); background: var(--bar-2); color: var(--bar-ink); border-radius: .5rem; cursor: pointer; font-size: .9rem; font-weight: 600; min-height: 2.8rem; }
      .tab { position: relative; }
      .tab svg { width: 1.6rem; height: 1.6rem; }
      .tab .badge { position: absolute; top: .25rem; right: .4rem; min-width: 1.4rem; height: 1.4rem; padding: 0 .3rem; border-radius: .7rem; background: var(--pulse); color: #10141a; font-size: .8rem; font-weight: 800; line-height: 1.4rem; text-align: center; }
      .tab.on { background: var(--accent-light); border-color: var(--accent-light); color: #10141a; }
      .tab.pulse { border-color: var(--pulse); animation: pulse 0.7s ease-in-out infinite alternate; }
      @keyframes pulse { from { box-shadow: 0 0 0 0 rgba(224,165,74,.9); } to { box-shadow: 0 0 0 .3rem rgba(224,165,74,.15); } }
      #speed { display: flex; gap: .3rem; align-items: stretch; }
      #speed .btn { background: var(--bar-2); border-color: var(--bar-line); color: var(--bar-ink); justify-content: center; align-items: center; min-width: 3.2rem; font-weight: 600; }
      #pauseBtn { width: 5.4rem; }
      #speed .btn.on { background: var(--accent-light); border-color: var(--accent-light); color: #10141a; }

      /* ---------- screens (start, report, ending) ---------- */
      dl.report { display: grid; grid-template-columns: 1fr auto; gap: .2rem 1rem; margin: .6rem 0; }
      dl.report dt { color: var(--muted); }
      dl.report dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
      ul.failures { margin: 0; padding-left: 1.2rem; }
      ul.plain { list-style: none; margin: 0; padding: 0; }
      .tone { padding: .5rem .7rem; border-radius: .4rem; background: #e7eef6; margin: .6rem 0; }
      input[type=text] { pointer-events: auto; max-width: 100%; min-height: 2.8rem; font: inherit; padding: .3rem .5rem; border: 2px solid var(--line); border-radius: .3rem; background: #fff; color: var(--ink); }

      /* ---------- dev drawer (backtick; not part of the game's layout) ---------- */
      #dev { position: fixed; right: 0; top: 0; bottom: 0; width: 360px; max-width: 100%; background: #fff; border-left: 1px solid #ccc; z-index: 8; overflow-y: auto; padding: 14px; font: 13px/1.4 var(--ui); }
      #dev .btn { min-height: 0; padding: 4px 8px; font-size: 13px; }
      #dev h2 { font-size: 12px; }
      #dev section { margin-bottom: 14px; }
      #dev pre { white-space: pre-wrap; font-size: 12px; margin: 0; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud">
      <header id="top" class="region">
        <div class="row1">
          <div id="clock"></div>
          <div id="mood"></div>
          <div id="doing"></div>
          <button class="btn" id="holding" data-act="putBack" hidden></button>
          <button class="btn" id="homeBtn" data-act="home">Go home</button>
          <button class="btn" id="walkBtn" data-act="abandon">Walk away</button>
        </div>
        <div class="row2"><div id="next"></div><div id="banner" hidden></div></div>
      </header>
      <section id="stage" class="region">
        <div id="modal"><div id="screen" class="modal-box screen" hidden><div id="screenBody"></div></div><div id="note" class="modal-box notecard" hidden></div></div>
        <div id="toast" role="status"></div>
        <div id="flash" role="alert"></div>
        <div id="tooltip" hidden></div>
      </section>
      <img id="ghost" alt="" hidden>
      <aside id="rail" class="region"><h2>Notes</h2><div id="notes"></div><div id="more"></div><div id="recent"></div></aside>
      <nav id="bottom" class="region"><div id="tabs"></div><div id="speed"></div></nav>
    </div>
    <aside id="dev" hidden></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
