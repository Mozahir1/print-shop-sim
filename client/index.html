<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Print Shop Sim</title>
    <style>
      :root {
        --bg: #f3f1ec;
        --card: #ffffff;
        --ink: #1f2328;
        --muted: #6b7078;
        --line: #dedad2;
        --accent: #2f5d8a;
        --accent-ink: #ffffff;
        --soft: #e7eef6;
        --ok: #2e7d4f;
        --warn: #a86400;
        --warn-bg: #fbf0dc;
        --bad: #b3261e;
        --bad-bg: #fbe5e3;
        --floor: #ece7dd;
        --wall: #ddd5c6;
        --counter: #c8b597;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17191c;
          --card: #22252a;
          --ink: #e6e6e3;
          --muted: #9a9ea6;
          --line: #363a40;
          --accent: #7aa7d6;
          --accent-ink: #10141a;
          --soft: #263241;
          --ok: #6cc28f;
          --warn: #e0a54a;
          --warn-bg: #3a2f1c;
          --bad: #f08a80;
          --bad-bg: #3d2423;
          --floor: #1f2125;
          --wall: #2a2d33;
          --counter: #5b4b37;
        }
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
      button { font: inherit; color: inherit; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
      .muted { color: var(--muted); }
      .small { font-size: 13px; }
      .ok { color: var(--ok); }
      .warn { color: var(--warn); }
      kbd { font: 11px ui-monospace, monospace; border: 1px solid currentColor; border-radius: 3px; padding: 0 3px; opacity: .7; }

      header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
      .brand { font-weight: 600; }
      #clock { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .spacer { flex: 1; }
      .speed { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
      .speed button { border: 0; background: var(--card); padding: 6px 10px; cursor: pointer; border-right: 1px solid var(--line); min-height: 36px; }
      .speed button:last-child { border-right: 0; }
      .speed button.on { background: var(--accent); color: var(--accent-ink); }
      .chip { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--bad-bg); color: var(--bad); }
      .mood { font-size: 13px; padding: 2px 8px; border-radius: 10px; }
      .mood.calm { background: var(--soft); }
      .mood.annoyed { background: var(--warn-bg); color: var(--warn); }
      .mood.unhappy { background: var(--bad-bg); color: var(--bad); }

      #banner { margin: 8px 16px 0; padding: 8px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); }

      main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; padding: 12px 16px 16px; align-items: start; }
      @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
      .col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

      #stageWrap { position: relative; padding: 0; overflow: hidden; display: flex; flex-direction: column; }
      #stage { display: block; width: 100%; height: auto; }
      #doing { padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
      #hands:empty, #panel:empty { display: none; }
      #hands, #panel { padding: 10px 12px; }
      #hands { border-bottom: 1px solid var(--line); background: var(--soft); }
      .bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding: 6px 16px; flex-wrap: wrap; background: var(--card); }
      body { padding-bottom: 72px; }
      .bottom { flex-wrap: nowrap; }
      #hand { display: flex; align-items: center; gap: 6px; font-size: 13px; flex: none; }
      #handIcon { width: 40px; height: 40px; border: 1px dashed var(--line); border-radius: 6px; }
      #tabs { display: flex; gap: 4px; flex: 1; overflow-x: auto; min-width: 0; }
      .tab { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 6px 10px; min-height: 44px; cursor: pointer; white-space: nowrap; flex: none; }
      @media (max-width: 600px) { #handLabel { display: none; } .bottom { padding: 6px 8px; } }
      .tab.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
      .tab.pulse { animation: pulse 0.9s ease-in-out infinite alternate; border-color: var(--warn); }
      @keyframes pulse { from { box-shadow: 0 0 0 0 var(--warn); } to { box-shadow: 0 0 0 3px var(--warn); } }

      .textbox { border: 2px solid var(--ink); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; background: var(--card); cursor: pointer; position: relative; }
      .textbox .who { font-size: 12px; font-weight: 600; color: var(--muted); }
      .textbox p { margin: 2px 0; }
      .textbox .more { position: absolute; right: 10px; bottom: 6px; font-size: 12px; color: var(--muted); }

      .orderform { display: flex; flex-direction: column; gap: 8px; }
      .field { display: flex; align-items: center; gap: 10px; border: 0; padding: 0; margin: 0; flex-wrap: wrap; }
      .field > span { min-width: 80px; color: var(--muted); font-size: 13px; }
      .field input[type=number], .field input[type=text] { width: 110px; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); }
      .chips { display: flex; flex-wrap: wrap; gap: 4px; }
      .chip-opt input { position: absolute; opacity: 0; }
      .chip-opt span { display: inline-block; border: 1px solid var(--line); border-radius: 14px; padding: 6px 12px; cursor: pointer; min-height: 34px; }
      .chip-opt input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
      .chip-opt input:focus-visible + span { outline: 2px solid var(--accent); }
      .scale { font-family: ui-monospace, monospace; }

      .targets { display: flex; flex-wrap: wrap; gap: 10px; min-height: 60px; }
      .target { border: 1px dashed var(--ink); background: #f4f4f0; color: #222; border-radius: 4px; padding: 10px 12px; min-height: 44px; cursor: pointer; }
      .holdbtn { min-width: 200px; user-select: none; touch-action: none; }
      .holdbtn .bar { background: rgba(255,255,255,.35); }
      .holdbtn .bar > div { background: var(--accent-ink); }
      .dragrow { display: flex; align-items: center; gap: 14px; }
      .dragitem, .slot { min-height: 56px; min-width: 90px; border-radius: 8px; cursor: grab; font: inherit; touch-action: none; }
      .dragitem { border: 2px solid var(--ink); background: var(--card); }
      .dragitem.on { outline: 3px solid var(--accent); }
      .slot { border: 2px dashed var(--accent); background: var(--soft); }
      .ghost { position: fixed; z-index: 40; pointer-events: none; padding: 8px 12px; border: 2px solid var(--ink); border-radius: 8px; background: var(--card); opacity: .9; }

      #notes { display: flex; flex-direction: column; gap: 8px; }
      .note { background: #fff3a8; color: #2b2a1f; padding: 8px 10px; border-radius: 2px; box-shadow: 1px 2px 4px rgba(0,0,0,.15); font: 14px/1.35 "Comic Sans MS", "Marker Felt", system-ui, sans-serif; transition: opacity .5s; }
      .note .hint { margin-top: 4px; font-size: 12px; font-weight: 700; color: #6b5a00; }
      .note.done > div:first-child { text-decoration: line-through; }

      .btn { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 7px 10px; cursor: pointer; text-align: left; min-height: 38px; }
      .btn:hover { border-color: var(--accent); }
      .btn:active, .btn.pressed { transform: translateY(1px); filter: brightness(.92); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      .btn.corner { border-style: dashed; }
      .btn.off { opacity: .45; }
      .btn.small { min-height: 28px; padding: 2px 8px; font-size: 13px; }
      .btn .dur { opacity: .7; font-size: 12px; margin-left: 6px; }
      .btn .kind { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; opacity: .75; }
      .btns { display: flex; flex-wrap: wrap; gap: 6px; }
      .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
      .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      @media (max-width: 420px) { .choices { grid-template-columns: 1fr; } }

      .free { margin: 0 0 8px; }
      ol.steps { list-style: none; margin: 6px 0 10px; padding: 0; font-size: 14px; }
      ol.steps li { padding: 2px 0; color: var(--muted); }
      ol.steps li.done { color: var(--ok); }
      ol.steps li.now { color: var(--ink); font-weight: 600; }
      .doing .bar, .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 4px; }
      .bar > div { height: 100%; background: var(--accent); }
      .said { margin: 6px 0 8px; padding: 8px 10px; background: var(--soft); border-radius: 8px; }
      dl.spec { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 0 0 8px; font-size: 14px; }
      dl.spec dt { color: var(--muted); }
      dl.spec dd { margin: 0; }

      ul.plain { list-style: none; margin: 0; padding: 0; }
      ul.plain li { padding: 6px 0; border-bottom: 1px solid var(--line); }
      ul.plain li:last-child { border-bottom: 0; }

      #log ol { list-style: none; margin: 0; padding: 0; max-height: 140px; overflow-y: auto; font-size: 13px; }
      #log li { padding: 1px 0; display: flex; gap: 10px; }
      #log time { color: var(--muted); min-width: 64px; font-variant-numeric: tabular-nums; }
      .msg { padding: 6px 0; border-bottom: 1px solid var(--line); }
      .msg.unread .subj { font-weight: 600; }

      #flash { position: absolute; z-index: 3; left: 8px; right: 8px; top: 8px; padding: 6px 10px; border-radius: 6px; background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad); font-size: 14px; }
      #tip { position: fixed; z-index: 30; max-width: 280px; padding: 6px 10px; border-radius: 6px; background: var(--ink); color: var(--card); font-size: 13px; pointer-events: none; opacity: 0; transition: opacity .15s; }
      #tip.show { opacity: 1; }

      .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
      .overlay > div { background: var(--card); border-radius: 10px; padding: 22px; width: 560px; max-width: 100%; max-height: 90vh; overflow-y: auto; }
      .overlay h1 { margin: 0 0 8px; font-size: 20px; }
      dl.report { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; margin: 12px 0; }
      dl.report dt { color: var(--muted); }
      dl.report dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
      ul.failures { margin: 0; padding-left: 18px; font-size: 14px; }
      .tone { padding: 10px 12px; border-radius: 8px; background: var(--soft); margin: 12px 0; }
      input[type=text] { max-width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); }

      #dev { position: fixed; right: 0; top: 0; bottom: 0; width: 360px; max-width: 100%; background: var(--card); border-left: 1px solid var(--line); z-index: 8; overflow-y: auto; padding: 14px; font-size: 13px; }
      #dev section { margin-bottom: 14px; }
      #dev pre { white-space: pre-wrap; font-size: 12px; margin: 0; }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">Print Shop</span>
      <span id="day" class="muted"></span>
      <span id="clock"></span>
      <span id="mood"></span>
      <span class="spacer"></span>
      <span id="home"></span>
      <div id="speed" class="speed"></div>
      <span id="botChip" class="chip" hidden>Bot is playing <button class="btn small" data-act="stopBot">Stop</button></span>
      <span id="devBadge" class="chip" hidden>Dev</span>
    </header>
    <div id="banner" hidden></div>
    <main>
      <div class="col">
        <div class="card" id="stageWrap">
          <div id="doing"></div>
          <canvas id="stage" width="800" height="300" aria-label="Where you are"></canvas>
          <div id="hands"></div>
          <div id="panel"></div>
          <div class="bottom"><div id="hand"><canvas id="handIcon" width="40" height="40"></canvas><span id="handLabel"></span></div><nav id="tabs"></nav></div>
          <div id="flash" hidden></div>
        </div>
      </div>
      <div class="col">
        <div class="card"><h2>Notes</h2><div id="notes"></div></div>
        <div class="card" id="log"><h2>What happened</h2><ol></ol></div>
      </div>
    </main>
    <aside id="dev" hidden></aside>
    <div id="screen" class="overlay" hidden><div id="screenBody"></div></div>
    <div id="tip"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
